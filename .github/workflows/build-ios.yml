name: build-ios

# 로컬에 Mac이 없어서 **이 워크플로우가 iOS의 유일한 컴파일러**다 — Swift 오류를 여기서 잡는다.
# 그래서 잡을 둘로 나눴다:
#   compile — 서명 없이 시뮬레이터로 빌드. 시크릿이 없어도 돌고, Swift 오류만 빠르게 본다.
#   archive — 서명 아카이브 + IPA 추출(+ 선택적 TestFlight 업로드). 서명 값이 있어야 한다.
# Android는 build-debug.yml(ubuntu)에서 따로 돌린다.
#
# 설정값은 로컬 파일에 두지 않고 전부 이 워크플로우가 주입한다. 각 값은
# Actions Secrets · Variables 어느 쪽에 넣어도 받는다(`secrets.X || vars.X`) — 서버 주소나
# 팀 ID처럼 비밀이 아닌 값은 Variables에 두는 게 로그에서 가려지지 않아 디버깅이 쉽다.
# 단 .p8 개인키는 Secrets에만 둔다.

on:
  workflow_dispatch:
    inputs:
      archive:
        description: '서명 아카이브 + IPA 추출까지 (서명 값 필요)'
        type: boolean
        default: false
      upload_testflight:
        description: 'IPA를 TestFlight에 업로드 (archive도 함께 켜야 함)'
        type: boolean
        default: false

  push:
    branches: [ feature/ios ]

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────── Swift 컴파일 검사 ────────────────────
  compile:
    name: Swift 컴파일 검사 (시뮬레이터 · 서명 없음)
    # macos-15는 Apple Silicon이다. KMP 타깃이 iosArm64 + iosSimulatorArm64뿐이라
    # Intel 러너(macos-13)에서는 시뮬레이터용 프레임워크가 만들어지지 않는다.
    runs-on: macos-15
    timeout-minutes: 90
    env:
      NETWORK_BASE_URL: ${{ secrets.NETWORK_BASE_URL || vars.NETWORK_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      # Xcode Run Script가 ./gradlew를 부른다. sharedLogic은 JDK 21을 쓴다(Android 잡의 17이 아니다).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Xcode 선택
        run: |
          # 프로젝트가 objectVersion 77 + File System Synchronized Group을 써서 16.2 이상이 필요하다.
          XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n1 || true)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version

      - name: 설정값 확인
        run: |
          if [ -n "$NETWORK_BASE_URL" ]; then
            echo "NETWORK_BASE_URL: 설정됨"
          else
            echo "NETWORK_BASE_URL: 미설정"
            echo "::warning::NETWORK_BASE_URL이 없습니다 — API 호출이 전부 실패하는 빌드가 됩니다(컴파일 검사용으론 무해)."
          fi

      - name: Kotlin/Native · 생성물 먼저 확인
        # Swift보다 먼저 깨질 수 있는 쪽을 따로 떼어 둔다 — 실패 위치를 바로 알 수 있다.
        # NETWORK_BASE_URL은 build.gradle.kts가 환경변수에서 직접 읽는다(점이 있는 키 이름은
        # Actions 환경변수로 못 넘기므로 NETWORK_BASE_URL → network.baseUrl로 매핑해 둔 것).
        run: |
          chmod +x ./gradlew
          ./gradlew :sharedLogic:compileKotlinIosSimulatorArm64 :generateRunvealIosResources --no-daemon

      - name: SPM 캐시
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('iosApp/iosApp.xcodeproj/project.pbxproj') }}
          restore-keys: spm-${{ runner.os }}-

      - name: 빌드 (시뮬레이터 · 서명 없음)
        # 시뮬레이터 대상이라 서명이 필요 없다 — 팀 ID·인증서 없이도 Swift 전량을 컴파일해 볼 수 있다.
        run: |
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

  # ──────────────────── 아카이브 + IPA ────────────────────
  archive:
    name: 아카이브 + IPA
    needs: compile
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.archive }}
    runs-on: macos-15
    timeout-minutes: 90
    env:
      NETWORK_BASE_URL: ${{ secrets.NETWORK_BASE_URL || vars.NETWORK_BASE_URL }}
      # 아래 셋은 식별자라 비밀이 아니다 — Variables에 둬도 된다.
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID || vars.APPSTORE_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID || vars.APPSTORE_ISSUER_ID }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID || vars.IOS_TEAM_ID }}
      # .p8 개인키는 Secrets에만 둔다.
      APPSTORE_PRIVATE_KEY_BASE64: ${{ secrets.APPSTORE_PRIVATE_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Xcode 선택
        run: |
          XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n1 || true)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version

      - name: 설정값 확인
        # 배포본은 값이 하나라도 비면 만들지 않는다 — 서버 주소 없는 IPA, 서명 못 한 IPA를
        # 아티팩트로 남기면 나중에 어느 빌드가 쓸 수 있는 건지 구분이 안 된다.
        run: |
          missing=""
          for name in NETWORK_BASE_URL APPSTORE_KEY_ID APPSTORE_ISSUER_ID IOS_TEAM_ID APPSTORE_PRIVATE_KEY_BASE64; do
            if [ -z "${!name}" ]; then missing="$missing $name"; else echo "$name: 설정됨"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::다음 값이 비어 있습니다 —$missing (Actions Secrets 또는 Variables에 추가하세요)"
            exit 1
          fi

      - name: App Store Connect API 키 복원
        run: |
          # altool과 xcodebuild 모두 ~/private_keys/AuthKey_<KEY_ID>.p8 규칙을 따른다.
          mkdir -p "$HOME/private_keys"
          echo "$APPSTORE_PRIVATE_KEY_BASE64" | base64 --decode > "$HOME/private_keys/AuthKey_$APPSTORE_KEY_ID.p8"
          chmod 600 "$HOME/private_keys/AuthKey_$APPSTORE_KEY_ID.p8"

      - name: ExportOptions.plist에 팀 ID 주입
        # plist는 $(VAR) 치환을 하지 않아서 값으로 직접 써 넣어야 한다.
        run: |
          /usr/libexec/PlistBuddy -c "Set :teamID $IOS_TEAM_ID" iosApp/ExportOptions.plist

      - name: 아카이브
        run: |
          # 빌드 번호(CURRENT_PROJECT_VERSION)를 run_number로 주입 — Android versionCode와 같은 패턴.
          # TestFlight는 같은 빌드 번호 재업로드를 거부하므로 매 실행 증가가 필수다.
          # TEAM_ID는 Config.xcconfig가 DEVELOPMENT_TEAM에 쓰는 값이라 둘 다 넘긴다
          # (로컬 xcconfig는 비어 있고 CI가 채우는 구조).
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runveal.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_$APPSTORE_KEY_ID.p8" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            TEAM_ID="$IOS_TEAM_ID" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: IPA 추출
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runveal.xcarchive" \
            -exportOptionsPlist iosApp/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_$APPSTORE_KEY_ID.p8" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"
          ls -lh "$RUNNER_TEMP/export"

      - name: IPA 아티팩트 업로드
        # Actions 실행 페이지 하단 Artifacts에서 내려받을 수 있다.
        uses: actions/upload-artifact@v4
        with:
          name: runveal-ios-ipa-build${{ github.run_number }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: TestFlight 업로드
        if: ${{ inputs.upload_testflight }}
        run: |
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -n1)
          # --apiKey는 ~/private_keys/AuthKey_<KEY_ID>.p8을 알아서 찾는다(위에서 거기에 뒀다).
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"

      - name: 요약
        if: always()
        run: |
          {
            echo "### iOS 빌드 ${{ github.run_number }}"
            echo ""
            echo "- 빌드 번호: \`${{ github.run_number }}\`"
            echo "- 커밋: \`${{ github.sha }}\`"
            echo "- TestFlight 업로드: ${{ inputs.upload_testflight && '예' || '아니오' }}"
          } >> "$GITHUB_STEP_SUMMARY"
