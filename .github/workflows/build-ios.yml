name: build-ios

# QA 배포용 iOS 워크플로우 — **Firebase App Distribution까지만** 한다.
# App Store/TestFlight 업로드는 release-ios.yml로 분리했다(실수로 스토어에 올라가지 않게).
#
# 로컬에 Mac이 없어서 **이 워크플로우가 iOS의 유일한 컴파일러**다 — Swift 오류를 여기서 잡는다.
# Android는 build-debug.yml(ubuntu)에서 따로 돌린다.
#
#   compile  — 서명 없이 시뮬레이터로 빌드. 설정값이 없어도 돌고, Swift 오류만 빠르게 본다.
#   archive  — 아카이브 → Ad Hoc IPA를 아티팩트로만 남긴다(업로드 없음). 서명 시험용.
#   firebase — + Firebase App Distribution 업로드.
#
# **Ad Hoc 프로파일을 쓴다.** App Store 프로파일로 만든 IPA는 기기에 바로 설치할 수 없고,
# Firebase는 Apple을 거치지 않고 IPA를 직접 내려주므로 테스터 기기 UDID가 등록된 Ad Hoc이 필요하다.
#
# 설정값은 로컬 파일에 두지 않고 전부 이 워크플로우가 주입한다. 비밀이 아닌 값은
# Secrets·Variables 어느 쪽에 넣어도 받는다(`secrets.X || vars.X`).
#
# 서명 단계가 release-ios.yml과 겹치지만 composite action으로 묶지 않았다 — 두 파일 모두
# 위에서 아래로 읽어 바로 디버깅할 수 있는 쪽이 낫다고 봤다. 인증서 절차를 바꿀 땐 두 곳을 같이 고친다.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '어디까지 할지'
        type: choice
        options:
          - compile      # Swift 컴파일 검사만
          - archive      # + 아카이브, Ad Hoc IPA를 아티팩트로만
          - firebase     # + Firebase App Distribution 업로드
        default: compile

  # iOS가 깨지는 걸 머지 전에 잡는다. macOS 러너는 분당 10배로 과금되므로
  # **dev 푸시마다가 아니라 PR에서, iOS에 영향 있는 경로가 바뀔 때만** 돌린다
  # (dev 푸시는 PR 머지로 들어오니 PR에서 이미 한 번 돈 셈이다).
  pull_request:
    branches: [ dev ]
    paths:
      - 'iosApp/**'
      - 'sharedLogic/**'
      - 'gradle/runveal-tokens-swift.gradle.kts'
      - 'gradle/runveal-icons-swift.gradle.kts'
      - 'gradle/runveal-images-swift.gradle.kts'
      - 'gradle/runveal-bundle-assets-ios.gradle.kts'
      - 'design/**'
      - '.github/workflows/build-ios.yml'

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────── Swift 컴파일 검사 ────────────────────
  compile:
    name: Swift 컴파일 검사 (시뮬레이터 · 서명 없음)
    if: ${{ github.event_name == 'pull_request' || inputs.mode == 'compile' }}
    # macos-15는 Apple Silicon이다. KMP 타깃이 iosArm64 + iosSimulatorArm64뿐이라
    # Intel 러너(macos-13)에서는 시뮬레이터용 프레임워크가 만들어지지 않는다.
    runs-on: macos-15
    timeout-minutes: 90
    env:
      NETWORK_BASE_URL: ${{ secrets.NETWORK_BASE_URL || vars.NETWORK_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      # Xcode Run Script가 ./gradlew를 부른다. sharedLogic은 JDK 21을 쓴다(Android 잡의 17이 아니다).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Xcode 선택
        run: |
          # 프로젝트가 objectVersion 77 + File System Synchronized Group을 써서 16.2 이상이 필요하다.
          XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n1 || true)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version

      - name: 설정값 확인
        run: |
          if [ -n "$NETWORK_BASE_URL" ]; then
            echo "NETWORK_BASE_URL: 설정됨"
          else
            echo "::warning::NETWORK_BASE_URL이 없습니다 — API 호출이 전부 실패하는 빌드가 됩니다(컴파일 검사용으론 무해)."
          fi

      - name: Kotlin/Native · 생성물 먼저 확인
        # Swift보다 먼저 깨질 수 있는 쪽을 따로 떼어 둔다 — 실패 위치를 바로 알 수 있다.
        # NETWORK_BASE_URL은 build.gradle.kts가 환경변수에서 직접 읽는다(점이 있는 키 이름은
        # Actions 환경변수로 못 넘기므로 NETWORK_BASE_URL → network.baseUrl로 매핑해 뒀다).
        run: |
          chmod +x ./gradlew
          ./gradlew :sharedLogic:compileKotlinIosSimulatorArm64 :generateRunvealIosResources --no-daemon

      - name: SPM 캐시
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('iosApp/iosApp.xcodeproj/project.pbxproj') }}
          restore-keys: spm-${{ runner.os }}-

      - name: 빌드 (시뮬레이터 · 서명 없음)
        # 시뮬레이터 대상이라 서명이 필요 없다 — 인증서·프로파일 없이도 Swift 전량을 컴파일해 볼 수 있다.
        run: |
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

  # ──────────────────── 아카이브 → Ad Hoc IPA → Firebase ────────────────────
  distribute:
    name: 아카이브 · Ad Hoc IPA · Firebase 배포
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'compile' }}
    runs-on: macos-15
    timeout-minutes: 120
    env:
      BUNDLE_ID: com.sloth.runveal
      NETWORK_BASE_URL: ${{ secrets.NETWORK_BASE_URL || vars.NETWORK_BASE_URL }}
      # 식별자라 비밀이 아니다 — Variables에 둬도 된다.
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID || vars.IOS_TEAM_ID }}
      FIREBASE_APP_ID_IOS: ${{ secrets.FIREBASE_APP_ID_IOS || vars.FIREBASE_APP_ID_IOS }}
      # 아래는 Secrets 전용.
      IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
      IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
      IOS_PROVISIONING_PROFILE_ADHOC_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_ADHOC_BASE64 }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Xcode 선택
        run: |
          XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n1 || true)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version

      - name: 설정값 확인
        # 배포본은 값이 하나라도 비면 만들지 않는다 — 서버 주소 없는 IPA, 서명 못 한 IPA를
        # 아티팩트로 남기면 나중에 어느 빌드가 쓸 수 있는 건지 구분이 안 된다.
        run: |
          required="NETWORK_BASE_URL IOS_TEAM_ID IOS_DIST_CERT_P12_BASE64 IOS_DIST_CERT_PASSWORD
                    IOS_PROVISIONING_PROFILE_ADHOC_BASE64"
          case "${{ inputs.mode }}" in
            firebase) required="$required FIREBASE_APP_ID_IOS FIREBASE_SERVICE_ACCOUNT" ;;
          esac

          missing=""
          for name in $required; do
            if [ -z "${!name}" ]; then missing="$missing $name"; else echo "$name: 설정됨"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::다음 값이 비어 있습니다 —$missing (Actions Secrets 또는 Variables에 추가하세요)"
            exit 1
          fi

      - name: 서명 키체인 구성
        run: |
          # 러너 전용 임시 키체인. 비밀번호는 매 실행 무작위로 만들어 쓰고 버린다 — 시크릿이 아니다.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # 잡이 끝나기 전에 잠기지 않게 자동 잠금을 끈다.
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" \
            -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/dist.p12"

          # codesign이 키체인 접근 때 UI 프롬프트를 띄우지 않게 한다(헤드리스 러너).
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # 검색 목록에 넣어야 xcodebuild가 이 키체인을 본다.
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          echo "--- 설치된 서명 아이덴티티 ---"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: 프로비저닝 프로파일 설치 (Ad Hoc)
        run: |
          # Xcode 16은 프로파일을 ~/Library/Developer/Xcode/UserData/Provisioning Profiles 에서 찾고,
          # 그 이전 버전은 ~/Library/MobileDevice/Provisioning Profiles 를 본다 — 둘 다 넣는다.
          OLD="$HOME/Library/MobileDevice/Provisioning Profiles"
          NEW="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$OLD" "$NEW"

          FILE="$RUNNER_TEMP/adhoc.mobileprovision"
          echo "$IOS_PROVISIONING_PROFILE_ADHOC_BASE64" | base64 --decode > "$FILE"

          # 프로파일의 UUID를 꺼내 export 옵션에 넣는다 — 이름보다 모호하지 않다.
          PLIST="$RUNNER_TEMP/adhoc.plist"
          security cms -D -i "$FILE" > "$PLIST"
          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$PLIST")
          NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$PLIST")
          echo "adhoc: $NAME ($UUID)"

          cp "$FILE" "$OLD/$UUID.mobileprovision"
          cp "$FILE" "$NEW/$UUID.mobileprovision"
          echo "PROFILE_UUID_ADHOC=$UUID" >> "$GITHUB_ENV"

      - name: SPM 캐시
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('iosApp/iosApp.xcodeproj/project.pbxproj') }}
          restore-keys: spm-${{ runner.os }}-

      - name: 아카이브
        run: |
          # 빌드 번호(CURRENT_PROJECT_VERSION)를 run_number로 주입 — Android versionCode와 같은 패턴.
          # TEAM_ID는 Config.xcconfig가 DEVELOPMENT_TEAM에 쓰는 값이라 둘 다 넘긴다
          # (로컬 xcconfig는 비어 있고 CI가 채우는 구조).
          #
          # **서명은 여기서 하지 않는다**(CODE_SIGNING_ALLOWED=NO). xcodebuild의 커맨드라인 빌드
          # 설정은 SPM 패키지를 포함한 **모든 타깃**에 적용되는데, Lottie 같은 패키지 타깃은
          # 프로비저닝 프로파일을 받지 못해 "does not support provisioning profiles"로 깨진다.
          # 대신 아래 export 단계가 ExportOptions plist의 수동 서명 설정으로 앱과 임베드된
          # 프레임워크를 한꺼번에 서명한다 — 결과물은 같고 타깃 범위 문제만 사라진다.
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runveal.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            TEAM_ID="$IOS_TEAM_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: export 옵션 채우기
        run: |
          # plist는 $(VAR) 치환을 하지 않아서 값으로 직접 써 넣어야 한다.
          /usr/libexec/PlistBuddy -c "Set :teamID $IOS_TEAM_ID" iosApp/ExportOptions-AdHoc.plist
          /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:$BUNDLE_ID $PROFILE_UUID_ADHOC" iosApp/ExportOptions-AdHoc.plist

      - name: IPA 추출 (Ad Hoc)
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runveal.xcarchive" \
            -exportOptionsPlist iosApp/ExportOptions-AdHoc.plist \
            -exportPath "$RUNNER_TEMP/export-adhoc"
          ls -lh "$RUNNER_TEMP/export-adhoc"

      - name: IPA 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: runveal-ios-adhoc-build${{ github.run_number }}
          path: ${{ runner.temp }}/export-adhoc/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Firebase App Distribution 업로드
        if: ${{ inputs.mode == 'firebase' }}
        run: |
          # Android 잡과 같은 CLI·같은 서비스 계정 시크릿을 쓴다. iOS 앱이 Firebase SDK를 쓰지
          # 않으므로 GoogleService-Info.plist는 필요 없다 — 업로드는 앱 ID와 자격증명만 본다.
          echo "$FIREBASE_SERVICE_ACCOUNT" | base64 --decode > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"

          npm install -g firebase-tools
          IPA=$(ls "$RUNNER_TEMP"/export-adhoc/*.ipa | head -n1)
          firebase appdistribution:distribute "$IPA" \
            --app "$FIREBASE_APP_ID_IOS" \
            --groups qa \
            --release-notes "${{ github.ref_name }}@${{ github.sha }}"

      - name: 키체인·프로파일 정리
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision || true
          rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.mobileprovision || true

      - name: 요약
        if: always()
        run: |
          {
            echo "### iOS QA 빌드 ${{ github.run_number }}"
            echo ""
            echo "- 모드: \`${{ inputs.mode }}\`"
            echo "- 배포: Firebase App Distribution (Ad Hoc)"
            echo "- 빌드 번호: \`${{ github.run_number }}\`"
            echo "- 커밋: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
