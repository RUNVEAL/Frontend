name: build-ios

# QA 배포용 iOS 워크플로우 — **Firebase App Distribution까지만** 한다.
# App Store/TestFlight 업로드는 release-ios.yml로 분리했다(실수로 스토어에 올라가지 않게).
#
# 로컬에 Mac이 없어서 **이 워크플로우가 iOS의 유일한 컴파일러**다 — Swift 오류를 여기서 잡는다.
# Android는 build-debug.yml(ubuntu)에서 따로 돌린다.
#
#   compile  — 서명 없이 시뮬레이터로 빌드. 설정값이 없어도 돌고, Swift 오류만 빠르게 본다.
#   archive  — 아카이브 → Ad Hoc IPA를 아티팩트로만 남긴다(업로드 없음). 서명 시험용.
#   firebase — + Firebase App Distribution 업로드.
#
# **dev-ios에 푸시하면 firebase 모드와 같은 일을 한다** — 고친 걸 아이폰에 바로 설치해 보는 게
# 목적이라 IPA를 아티팩트로만 남기면 쓸 수 없다. 그때 compile 잡은 건너뛴다(distribute가 Release
# 전량을 컴파일하므로 Swift 오류는 거기서 같이 잡히고, macOS 러너를 두 개 쓸 이유가 없다).
#
# **Ad Hoc 프로파일을 쓴다.** App Store 프로파일로 만든 IPA는 기기에 바로 설치할 수 없고,
# Firebase는 Apple을 거치지 않고 IPA를 직접 내려주므로 테스터 기기 UDID가 등록된 Ad Hoc이 필요하다.
#
# 설정값은 로컬 파일에 두지 않고 전부 이 워크플로우가 주입한다. 비밀이 아닌 값은
# Secrets·Variables 어느 쪽에 넣어도 받는다(`secrets.X || vars.X`).
#
# 서명 단계가 release-ios.yml과 겹치지만 composite action으로 묶지 않았다 — 두 파일 모두
# 위에서 아래로 읽어 바로 디버깅할 수 있는 쪽이 낫다고 봤다. 인증서 절차를 바꿀 땐 두 곳을 같이 고친다.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '어디까지 할지'
        type: choice
        options:
          - compile      # Swift 컴파일 검사만
          - archive      # + 아카이브, Ad Hoc IPA를 아티팩트로만
          - firebase     # + Firebase App Distribution 업로드
        default: compile

  # 로컬에 Mac이 없어 이 워크플로우가 iOS의 유일한 컴파일러이므로, dev-ios에 커밋하면
  # Swift 오류를 바로 보도록 push에 걸어둔다. dev(Android)에는 걸지 않는다.
  #
  # PR에는 걸지 않는다 — macOS 러너는 분당 10배로 과금돼서, Android PR까지 iOS 빌드를
  # 끌고 가면 비용만 든다. iOS는 dev-ios push에서 확인하고 dev로 머지한다.
  #
  # 로컬에 Mac이 없어 이 워크플로우가 iOS의 유일한 컴파일러다 — dev-ios에 직접 커밋하면
  # 컴파일부터 Firebase 배포까지 한 번에 돌려서 아이폰에서 바로 확인한다.
  # 같은 비용 이유로 **iOS에 영향 있는 경로가 바뀔 때만** 돌린다 — 아래 paths가 그 목록이다.
  push:
    branches: [ dev-ios ]
    paths:
      - 'iosApp/**'
      - 'sharedLogic/**'
      - 'gradle/runveal-tokens-swift.gradle.kts'
      - 'gradle/runveal-icons-swift.gradle.kts'
      - 'gradle/runveal-images-swift.gradle.kts'
      - 'gradle/runveal-bundle-assets-ios.gradle.kts'
      - 'design/**'
      - '.github/workflows/build-ios.yml'

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────── Swift 컴파일 검사 ────────────────────
  compile:
    name: Swift 컴파일 검사 (시뮬레이터 · 서명 없음)
    # workflow_dispatch에서 mode가 compile일 때만 돈다. push(dev-ios)에서는 아래 distribute가
    # 같은 소스를 Release로 전량 컴파일하니 Swift 오류는 거기서 같이 잡힌다 — 분당 10배인
    # macOS 러너를 두 개 띄울 값이 없다.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'compile' }}
    # macos-15는 Apple Silicon이다. KMP 타깃이 iosArm64 + iosSimulatorArm64뿐이라
    # Intel 러너(macos-13)에서는 시뮬레이터용 프레임워크가 만들어지지 않는다.
    runs-on: macos-15
    timeout-minutes: 90
    env:
      NETWORK_BASE_URL: ${{ secrets.NETWORK_BASE_URL || vars.NETWORK_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      # Xcode Run Script가 ./gradlew를 부른다. sharedLogic은 JDK 21을 쓴다(Android 잡의 17이 아니다).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Xcode 선택
        run: |
          # 프로젝트가 objectVersion 77 + File System Synchronized Group을 써서 16.2 이상이 필요하다.
          #
          # 상한은 두지 않는다 — Apple이 2026년부터 **iOS 26 SDK 이상**으로 빌드한 앱만 App Store
          # Connect에 받는다(업로드 오류 90725). Xcode 16에 묶어 두면 18.x SDK라 거부되므로,
          # 러너에 깔린 Xcode 중 가장 높은 버전을 고른다.
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n1 || true)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          set -o pipefail
          xcodebuild -version 2>&1 | tee -a "$RUNNER_TEMP/xcodebuild.log"
          # 어느 iOS SDK로 빌드되는지 남긴다 — 90725를 미리 알아보려고.
          xcodebuild -showsdks 2>&1 | grep -i iphoneos | tee -a "$RUNNER_TEMP/xcodebuild.log" || true

      - name: 설정값 확인
        run: |
          if [ -n "$NETWORK_BASE_URL" ]; then
            echo "NETWORK_BASE_URL: 설정됨"
          else
            echo "::warning::NETWORK_BASE_URL이 없습니다 — API 호출이 전부 실패하는 빌드가 됩니다(컴파일 검사용으론 무해)."
          fi

      - name: Kotlin/Native · 생성물 먼저 확인
        # Swift보다 먼저 깨질 수 있는 쪽을 따로 떼어 둔다 — 실패 위치를 바로 알 수 있다.
        # NETWORK_BASE_URL은 build.gradle.kts가 환경변수에서 직접 읽는다(점이 있는 키 이름은
        # Actions 환경변수로 못 넘기므로 NETWORK_BASE_URL → network.baseUrl로 매핑해 뒀다).
        run: |
          chmod +x ./gradlew
          ./gradlew :sharedLogic:compileKotlinIosSimulatorArm64 :generateRunvealIosResources --no-daemon

      - name: SPM 캐시
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('iosApp/iosApp.xcodeproj/project.pbxproj') }}
          restore-keys: spm-${{ runner.os }}-

      - name: 빌드 (시뮬레이터 · 서명 없음)
        # 시뮬레이터 대상이라 서명이 필요 없다 — 인증서·프로파일 없이도 Swift 전량을 컴파일해 볼 수 있다.
        run: |
          set -o pipefail
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO 2>&1 | tee -a "$RUNNER_TEMP/xcodebuild.log"

      - name: 실패 시 오류만 추려 보기
        # 이 잡이 Swift 오류를 가장 먼저 만나는 자리다 — 수천 줄 로그에서 error: 줄만 추려
        # 잡 요약(Summary)에 올린다.
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/xcodebuild.log"
          if [ ! -f "$LOG" ]; then
            echo "빌드 로그가 없습니다 — xcodebuild 이전 단계에서 실패했습니다."
            exit 0
          fi

          # 컴파일 오류(error:)뿐 아니라 링커 오류도 잡는다 — "Undefined symbols" 블록에는
          # error: 가 없어서 전에 놓쳤다.
          ERRORS=$(grep -E "error: |Undefined symbol|symbol\(s\) not found|^ld: " "$LOG" \
            | sort -u | head -80)

          {
            echo "### Swift 컴파일 오류"
            echo ""
            if [ -n "$ERRORS" ]; then
              echo '```'
              echo "$ERRORS"
              echo '```'
            else
              echo "\`error:\` 줄이 없습니다 — 컴파일이 아니라 스크립트 단계에서 실패했을 수 있습니다."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "--- 오류 줄 ---"
          echo "$ERRORS"

  # ──────────────────── 아카이브 → Ad Hoc IPA → Firebase ────────────────────
  distribute:
    name: 아카이브 · Ad Hoc IPA · Firebase 배포
    # dev-ios 푸시는 항상 Firebase까지 간다. workflow_dispatch는 고른 모드를 따른다.
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'compile') }}
    runs-on: macos-15
    timeout-minutes: 120
    env:
      # 이 잡이 어디까지 갈지. push에는 inputs가 없어서 firebase로 고정한다 —
      # 아래 단계들은 inputs.mode가 아니라 이 값만 본다.
      MODE: ${{ github.event_name == 'push' && 'firebase' || inputs.mode }}
      BUNDLE_ID: com.sloth.runveal
      NETWORK_BASE_URL: ${{ secrets.NETWORK_BASE_URL || vars.NETWORK_BASE_URL }}
      # 식별자라 비밀이 아니다 — Variables에 둬도 된다.
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID || vars.IOS_TEAM_ID }}
      FIREBASE_APP_ID_IOS: ${{ secrets.FIREBASE_APP_ID_IOS || vars.FIREBASE_APP_ID_IOS }}
      # 앱 번들에 들어가는 Firebase 설정 파일. 저장소에는 .gitignore로 없어서 여기서 되살린다.
      GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
      # 아래는 Secrets 전용.
      IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
      IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
      IOS_PROVISIONING_PROFILE_ADHOC_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_ADHOC_BASE64 }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Xcode 선택
        run: |
          # 상한을 두지 않는 이유는 compile 잡 쪽 주석 참고(iOS 26 SDK 요구).
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n1 || true)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          set -o pipefail
          xcodebuild -version 2>&1 | tee -a "$RUNNER_TEMP/xcodebuild.log"
          xcodebuild -showsdks 2>&1 | grep -i iphoneos | tee -a "$RUNNER_TEMP/xcodebuild.log" || true

      - name: 설정값 확인
        # 배포본은 값이 하나라도 비면 만들지 않는다 — 서버 주소 없는 IPA, 서명 못 한 IPA를
        # 아티팩트로 남기면 나중에 어느 빌드가 쓸 수 있는 건지 구분이 안 된다.
        run: |
          required="NETWORK_BASE_URL IOS_TEAM_ID IOS_DIST_CERT_P12_BASE64 IOS_DIST_CERT_PASSWORD
                    IOS_PROVISIONING_PROFILE_ADHOC_BASE64"
          case "$MODE" in
            firebase) required="$required FIREBASE_APP_ID_IOS FIREBASE_SERVICE_ACCOUNT" ;;
          esac

          missing=""
          for name in $required; do
            if [ -z "${!name}" ]; then missing="$missing $name"; else echo "$name: 설정됨"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::다음 값이 비어 있습니다 —$missing (Actions Secrets 또는 Variables에 추가하세요)"
            exit 1
          fi

      - name: GoogleService-Info.plist 복원
        # **저장소에 없는 파일이다**(.gitignore). 없으면 앱이 `FirebaseApp.configure()`를 건너뛰고
        # (iOSApp.init), Crashlytics 콘솔은 이벤트를 한 번도 못 받아 "SDK 추가" 화면에 머문다.
        # dSYM을 올릴 때도 이 파일로 인증한다.
        #
        # 시크릿이 base64인지 평문 XML인지 모르므로 둘 다 받는다 — 디코드해서 plist로 읽히면
        # base64, 아니면 내용을 그대로 쓴 것으로 본다.
        run: |
          DEST=iosApp/iosApp/GoogleService-Info.plist
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "::warning::GOOGLE_SERVICE_INFO_PLIST가 비어 있습니다 — Crashlytics 없이 빌드됩니다."
            exit 0
          fi

          if echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > "$DEST" 2>/dev/null \
             && plutil -lint "$DEST" > /dev/null 2>&1; then
            echo "base64로 복원했습니다."
          else
            printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > "$DEST"
            plutil -lint "$DEST"
            echo "평문으로 복원했습니다."
          fi

          # 값 자체는 찍지 않는다 — 번들 ID만 확인해서 Firebase 앱과 맞는지 본다.
          /usr/libexec/PlistBuddy -c "Print :BUNDLE_ID" "$DEST"

      - name: 서명 키체인 구성
        run: |
          # 러너 전용 임시 키체인. 비밀번호는 매 실행 무작위로 만들어 쓰고 버린다 — 시크릿이 아니다.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # 잡이 끝나기 전에 잠기지 않게 자동 잠금을 끈다.
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          # -T /usr/bin/codesign: codesign이 이 키를 쓸 때 확인 창을 띄우지 않게 미리 허용한다.
          security import "$RUNNER_TEMP/dist.p12" \
            -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/security -k "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/dist.p12"

          # codesign이 키체인 접근 때 UI 프롬프트를 띄우지 않게 한다(헤드리스 러너).
          # codesign: 파티션을 빠뜨리면 아카이브·export가 "User interaction is not allowed"로 멈춘다.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # 검색 목록에 넣어야 xcodebuild가 이 키체인을 본다.
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          echo "--- 설치된 서명 아이덴티티 ---"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: 프로비저닝 프로파일 설치 (Ad Hoc)
        run: |
          # Xcode 16은 프로파일을 ~/Library/Developer/Xcode/UserData/Provisioning Profiles 에서 찾고,
          # 그 이전 버전은 ~/Library/MobileDevice/Provisioning Profiles 를 본다 — 둘 다 넣는다.
          OLD="$HOME/Library/MobileDevice/Provisioning Profiles"
          NEW="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$OLD" "$NEW"

          FILE="$RUNNER_TEMP/adhoc.mobileprovision"
          echo "$IOS_PROVISIONING_PROFILE_ADHOC_BASE64" | base64 --decode > "$FILE"

          # 프로파일의 UUID를 꺼내 export 옵션에 넣는다 — 이름보다 모호하지 않다.
          PLIST="$RUNNER_TEMP/adhoc.plist"
          security cms -D -i "$FILE" > "$PLIST"
          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$PLIST")
          NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$PLIST")
          echo "adhoc: $NAME ($UUID)"

          cp "$FILE" "$OLD/$UUID.mobileprovision"
          cp "$FILE" "$NEW/$UUID.mobileprovision"
          echo "PROFILE_UUID_ADHOC=$UUID" >> "$GITHUB_ENV"

      - name: Kotlin/Native · 생성물 먼저 확인
        # **아카이브 전에 반드시 돌아야 한다.** 디자인 토큰·아이콘·이미지 Swift 파일은 생성물이라
        # (.gitignore) 체크아웃 직후엔 없는데, Xcode는 File System Synchronized Group의 파일 목록을
        # 빌드 시작 시점에 잡는다. Run Script 안에서 만들면 그 빌드에는 안 잡혀서
        # "cannot find 'RunvealSpacing' in scope" 같은 오류가 쏟아진다.
        run: |
          chmod +x ./gradlew
          ./gradlew :sharedLogic:compileKotlinIosArm64 :generateRunvealIosResources --no-daemon

      - name: SPM 캐시
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('iosApp/iosApp.xcodeproj/project.pbxproj') }}
          restore-keys: spm-${{ runner.os }}-

      - name: 아카이브
        run: |
          # 빌드 번호(CURRENT_PROJECT_VERSION)를 run_number로 주입 — Android versionCode와 같은 패턴.
          # TEAM_ID는 Config.xcconfig가 DEVELOPMENT_TEAM에 쓰는 값이라 둘 다 넘긴다
          # (로컬 xcconfig는 비어 있고 CI가 채우는 구조).
          #
          # **서명은 여기서 하지 않는다**(CODE_SIGNING_ALLOWED=NO). xcodebuild의 커맨드라인 빌드
          # 설정은 SPM 패키지를 포함한 **모든 타깃**에 적용되는데, Lottie 같은 패키지 타깃은
          # 프로비저닝 프로파일을 받지 못해 "does not support provisioning profiles"로 깨진다.
          # 대신 아래 export 단계가 ExportOptions plist의 수동 서명 설정으로 앱과 임베드된
          # 프레임워크를 한꺼번에 서명한다 — 결과물은 같고 타깃 범위 문제만 사라진다.
          set -o pipefail
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runveal.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            TEAM_ID="$IOS_TEAM_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} 2>&1 | tee -a "$RUNNER_TEMP/xcodebuild.log"

      - name: 아카이브 번들 점검
        # 로컬에 Mac도 아이폰도 없어 .app 안을 들여다볼 방법이 없다 — 앱이 시작 즉시 죽는 흔한
        # 원인 두 개(Crashlytics가 런타임에 읽는 GoogleService-Info.plist 누락, SPM이 고른 Firebase
        # 버전)를 여기서 잡 요약에 찍어 둔다. 테스터에게 물어보지 않고 Actions 화면만 봐도 된다.
        run: |
          APP="$RUNNER_TEMP/Runveal.xcarchive/Products/Applications/Runveal.app"
          {
            echo "### 아카이브 번들 점검"
            echo ""
            if [ -f "$APP/GoogleService-Info.plist" ]; then
              echo "- \`GoogleService-Info.plist\`: **있음** — Firebase가 초기화됩니다."
            else
              echo "- \`GoogleService-Info.plist\`: **없음** — 앱이 Firebase 초기화를 건너뜁니다(크래시 리포트 수집 안 됨)."
            fi
            echo ""
            echo "<details><summary>.app 최상위 목록</summary>"
            echo ""
            echo '```'
            ls -1 "$APP" 2>&1 | head -80
            echo '```'
            echo "</details>"
            echo ""
            echo "<details><summary>SPM이 고른 패키지 버전</summary>"
            echo ""
            echo '```'
            grep -iE "firebase-ios-sdk|maplibre-gl-native|lottie-ios" "$RUNNER_TEMP/xcodebuild.log" \
              | grep -iE "resolv|version|checkout|clon" | sort -u | head -20
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: export 옵션 채우기
        run: |
          # plist는 $(VAR) 치환을 하지 않아서 값으로 직접 써 넣어야 한다.
          /usr/libexec/PlistBuddy -c "Set :teamID $IOS_TEAM_ID" iosApp/ExportOptions-AdHoc.plist
          /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:$BUNDLE_ID $PROFILE_UUID_ADHOC" iosApp/ExportOptions-AdHoc.plist

      - name: IPA 추출 (Ad Hoc)
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runveal.xcarchive" \
            -exportOptionsPlist iosApp/ExportOptions-AdHoc.plist \
            -exportPath "$RUNNER_TEMP/export-adhoc" 2>&1 | tee -a "$RUNNER_TEMP/xcodebuild.log"
          ls -lh "$RUNNER_TEMP/export-adhoc"

      - name: IPA 점검 (임베드 프레임워크·서명)
        # 홈에서 `MLNMapView`를 만드는 순간 죽는데, MapLibre는 **동적 프레임워크**라 dyld가 첫 심볼을
        # 쓰는 그 시점에 로드한다 — 스플래시까지는 멀쩡하다가 지도에서만 죽는 모습과 맞는다.
        # 그래서 **export가 끝난 IPA를 열어** 프레임워크가 실제로 들어갔는지, 서명이 유효한지 본다.
        # 아카이브는 CODE_SIGNING_ALLOWED=NO로 만들고 export가 서명하는 구조라, 아카이브가 아니라
        # 이쪽을 봐야 진짜 결과물을 보는 것이다.
        continue-on-error: true
        run: |
          IPA=$(ls "$RUNNER_TEMP"/export-adhoc/*.ipa | head -n1)
          WORK="$RUNNER_TEMP/ipa-check"
          rm -rf "$WORK" && mkdir -p "$WORK"
          unzip -q "$IPA" -d "$WORK"
          APP=$(ls -d "$WORK"/Payload/*.app | head -n1)

          {
            echo "### IPA 점검"
            echo ""
            echo "<details><summary>임베드 프레임워크</summary>"
            echo ""
            echo '```'
            if [ -d "$APP/Frameworks" ]; then
              ls -1 "$APP/Frameworks"
            else
              echo "Frameworks 폴더가 없습니다 — 동적 프레임워크가 하나도 임베드되지 않았습니다."
            fi
            echo '```'
            echo "</details>"
            echo ""

            echo "<details><summary>앱 바이너리가 참조하는 동적 라이브러리</summary>"
            echo ""
            echo '```'
            otool -L "$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")" \
              | grep -iE "rpath|maplibre|lottie|Firebase" | head -30
            echo '```'
            echo "</details>"
            echo ""

            echo "<details><summary>SPM이 실제로 고른 버전 (Package.resolved)</summary>"
            echo ""
            echo '```'
            # xcodebuild 로그에는 해석 결과가 안 남는다 — DerivedData의 Package.resolved가 정답이다.
            cat "$RUNNER_TEMP/dd/SourcePackages/Package.resolved" 2>/dev/null \
              | grep -E '"identity"|"version"|"revision"' | head -40 \
              || echo "Package.resolved를 못 찾았습니다."
            echo '```'
            echo "</details>"
            echo ""

            echo "<details><summary>MapLibre 바이너리가 빌드된 SDK</summary>"
            echo ""
            echo '```'
            # MapLibre만 미리 빌드된 XCFramework다(나머지는 소스 컴파일) — 그 바이너리가 어느 SDK로
            # 만들어졌는지가 최신 Xcode/iOS와의 호환을 가른다.
            MLN="$APP/Frameworks/MapLibre.framework/MapLibre"
            if [ -f "$MLN" ]; then
              vtool -show-build "$MLN" 2>&1 | head -20
            else
              echo "MapLibre 바이너리를 못 찾았습니다: $MLN"
            fi
            echo '```'
            echo "</details>"
            echo ""

            echo "<details><summary>서명 검증</summary>"
            echo ""
            echo '```'
            echo "--- 앱 ---"
            codesign --verify --strict --verbose=2 "$APP" 2>&1 | head -20
            echo ""
            for fw in "$APP"/Frameworks/*; do
              [ -e "$fw" ] || continue
              echo "--- $(basename "$fw") ---"
              codesign --verify --strict --verbose=2 "$fw" 2>&1 | head -5
            done
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: IPA 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: runveal-ios-adhoc-build${{ github.run_number }}
          path: ${{ runner.temp }}/export-adhoc/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Firebase App Distribution 업로드
        if: ${{ env.MODE == 'firebase' }}
        run: |
          # Android 잡과 같은 CLI·같은 서비스 계정 시크릿을 쓴다. 업로드는 앱 ID와 자격증명만
          # 보므로 GoogleService-Info.plist는 필요 없다 — 그건 앱 번들에 들어가 Crashlytics가 런타임에
          # 읽는 파일이다.
          echo "$FIREBASE_SERVICE_ACCOUNT" | base64 --decode > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"

          npm install -g firebase-tools

          IPA=$(ls "$RUNNER_TEMP"/export-adhoc/*.ipa | head -n1)
          firebase appdistribution:distribute "$IPA" \
            --app "$FIREBASE_APP_ID_IOS" \
            --groups qa \
            --release-notes "${{ github.ref_name }}@${{ github.sha }}"

      - name: dSYM 아티팩트 업로드
        if: ${{ env.MODE != 'compile' }}
        # 자동 업로드가 실패해도 **Firebase 콘솔에 직접 올릴 수 있게** 남겨 둔다
        # (Crashlytics → dSYM 누락 → 업로드). 심볼이 없으면 스택이 주소로만 보인다.
        uses: actions/upload-artifact@v4
        with:
          name: runveal-ios-dsyms-build${{ github.run_number }}
          path: ${{ runner.temp }}/Runveal.xcarchive/dSYMs
          if-no-files-found: warn
          retention-days: 30

      - name: Crashlytics dSYM 업로드
        if: ${{ env.MODE == 'firebase' }}
        # 심볼이 없으면 Crashlytics 스택이 주소로만 보인다. Release 구성이 dwarf-with-dsym이라
        # 아카이브 안에 dSYM이 들어 있고, 그 폴더를 그대로 넘긴다.
        #
        # **firebase-tools의 `crashlytics:symbols:upload`는 Android NDK(.so) 전용이다** — iOS dSYM에
        # 쓰면 "No native libraries found"로 깨진다. iOS는 FirebaseCrashlytics 패키지에 들어 있는
        # `upload-symbols`를 쓰고, 인증도 서비스 계정이 아니라 GoogleService-Info.plist로 한다.
        #
        # 배포 **뒤에** 두고 실패해도 넘어간다 — 심볼은 보조 정보라, 이것 때문에 앱이 테스터에게
        # 가지 못하는 쪽이 더 나쁘다(전에 그렇게 막혔다). 대신 무슨 일이 있었는지는 잡 요약에 남겨
        # 둔다 — continue-on-error 때문에 잡이 초록색으로 끝나서, 로그를 안 보면 실패를 놓친다.
        continue-on-error: true
        run: |
          DSYMS="$RUNNER_TEMP/Runveal.xcarchive/dSYMs"
          PLIST=iosApp/iosApp/GoogleService-Info.plist
          {
            echo "### Crashlytics dSYM 업로드"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ ! -d "$DSYMS" ]; then
            echo "- dSYMs 폴더가 없습니다 — Release 구성의 DEBUG_INFORMATION_FORMAT을 확인하세요." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # dSYM마다 UUID를 찍어 둔다 — 콘솔이 "누락"이라고 가리키는 UUID와 맞춰 볼 수 있다.
          {
            echo "<details><summary>dSYM 목록과 UUID</summary>"
            echo ""
            echo '```'
            for d in "$DSYMS"/*.dSYM; do
              [ -e "$d" ] || continue
              echo "$(basename "$d")"
              dwarfdump --uuid "$d" 2>/dev/null || true
            done
            echo '```'
            echo "</details>"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # upload-symbols는 FirebaseCrashlytics 패키지 안에 있다. 체크아웃 위치가 버전에 따라
          # 달라져서 derivedDataPath 전체를 뒤진다.
          UPLOAD=$(find "$RUNNER_TEMP/dd" -name upload-symbols -type f 2>/dev/null | head -n1)
          if [ -z "$UPLOAD" ]; then
            echo "- \`upload-symbols\`를 못 찾았습니다 — 아티팩트의 dSYM을 콘솔에 직접 올려 주세요." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "upload-symbols: $UPLOAD"
          chmod +x "$UPLOAD"

          # 인증은 두 가지다 — plist(-gsp)가 1순위고, 그게 없거나 실패하면 앱 ID(-ai)로 한 번 더
          # 해 본다. 심볼이 plist 복원 성패에 통째로 묶이지 않게 한다.
          OK=0
          if [ -f "$PLIST" ] && "$UPLOAD" -gsp "$PLIST" -p ios "$DSYMS"; then
            OK=1
            echo "- 업로드 성공 (plist 인증)" >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$FIREBASE_APP_ID_IOS" ] && "$UPLOAD" -ai "$FIREBASE_APP_ID_IOS" -p ios "$DSYMS"; then
            OK=1
            echo "- 업로드 성공 (앱 ID 인증)" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$OK" = "0" ]; then
            {
              echo "- **업로드 실패** — 아티팩트 \`runveal-ios-dsyms-build${{ github.run_number }}\`를 내려받아"
              echo "  Crashlytics 콘솔(앱 → 설정 → dSYM 업로드)에 직접 올려 주세요."
              echo "- 심볼이 올라가야 **보류 중인 크래시가 이슈 목록에 나타납니다** — dSYM은 빌드마다"
              echo "  다르므로, 이 빌드의 dSYM은 이 빌드에서 난 크래시만 해석합니다."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 실패 시 오류만 추려 보기
        # xcodebuild 로그는 수천 줄이라 Actions 화면에서 error: 줄을 찾기 어렵다. 실패했을 때만
        # 오류 줄을 모아 잡 요약(Summary)에 올려 둔다 — 로그를 내려받아 뒤지지 않아도 원인이 보인다.
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/xcodebuild.log"
          if [ ! -f "$LOG" ]; then
            echo "빌드 로그가 없습니다 — xcodebuild 이전 단계에서 실패했습니다."
            exit 0
          fi

          # 같은 오류가 타깃·아키텍처마다 반복되므로 중복을 걷어낸다.
          # 컴파일 오류(error:)뿐 아니라 링커 오류도 잡는다 — "Undefined symbols" 블록에는
          # error: 가 없어서 전에 놓쳤다.
          ERRORS=$(grep -E "error: |Undefined symbol|symbol\(s\) not found|^ld: " "$LOG" \
            | sort -u | head -80)

          {
            echo "### 빌드 오류"
            echo ""
            if [ -n "$ERRORS" ]; then
              echo '```'
              echo "$ERRORS"
              echo '```'
            else
              echo "\`error:\` 줄이 없습니다 — 컴파일이 아니라 스크립트·서명 단계에서 실패했을 수 있습니다."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "--- 오류 줄 ---"
          echo "$ERRORS"

      - name: 키체인·프로파일 정리
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision || true
          rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.mobileprovision || true

      - name: 요약
        if: always()
        run: |
          {
            echo "### iOS QA 빌드 ${{ github.run_number }}"
            echo ""
            echo "- 모드: \`$MODE\`"
            echo "- 배포: Firebase App Distribution (Ad Hoc)"
            echo "- 빌드 번호: \`${{ github.run_number }}\`"
            echo "- 커밋: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
